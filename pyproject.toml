[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-scorecard"
version = "0.1.0"
description = "Measure what each Claude Code agent costs and delivers, then keep, fix, or remove it."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tigran Atayan", email = "tigran.a.atayan@gmail.com" }]
keywords = [
    "claude-code",
    "ai-agents",
    "multi-agent",
    "llm-cost",
    "token-usage",
    "prompt-caching",
    "observability",
    "developer-tools",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pydantic>=2.7",
    "rich>=13",
]

[project.scripts]
agent-scorecard = "agent_scorecard.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_scorecard"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"

[[tool.pyright.executionEnvironments]]
root = "src"
typeCheckingMode = "strict"

[[tool.pyright.executionEnvironments]]
root = "tests"
typeCheckingMode = "basic"

[tool.coverage.run]
omit = ["src/agent_scorecard/__main__.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=agent_scorecard --cov-report=term-missing --cov-fail-under=90"
